# Python
#
# @see https://www.python.org/
"core:python" = {
  version = "latest",
  # If you need to update or upgrade one library execute the bellow command.
  #
  #     mise install python -f
  #
  postinstall = """
python -m pip install --upgrade --user cryptography \
  cryptography \
  dbus-python \
  mkdocs-material \
  PyGObject \
  pyopenssl \
  rply
"""
}


# rsync for cloud storage
