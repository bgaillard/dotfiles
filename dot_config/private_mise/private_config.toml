[bootstrap.packages]
"apt:apt-file" = "latest"
"apt:apt-transport-https" = "latest"
"apt:autoconf" = "latest"
"apt:automake" = "latest"
"apt:bash-completion" = "latest"
"apt:bison" = "latest"              # Linux Kernel compilation
"apt:build-essential" = "latest"
"apt:ca-certificates" = "latest"
"apt:cargo" = "latest"
"apt:cifs-utils" = "latest"
"apt:clang" = "latest"
"apt:cmake" = "latest"
"apt:cpu-checker" = "latest"
"apt:curl" = "latest"
"apt:devscripts" = "latest"         # Linux Kernel compilation
"apt:dunst" = "latest"              # Lightweight notification daemon
"apt:etherwake" = "latest"
"apt:fakeroot" = "latest"           # Linux Kernel compilation
"apt:feh" = "latest"                # Lightweight image viewer
"apt:ffmpeg" = "latest"
"apt:flatpak" = "latest"
"apt:flex" = "latest"               # Linux Kernel compilation
"apt:g++" = "latest"
"apt:gcc" = "latest"
"apt:git" = "latest"
"apt:git-secrets" = "latest"        # Prevents you from committing secrets and credentials into git repositories
"apt:gnupg" = "latest"
"apt:groff" = "latest"
"apt:guestfs-tools" = "latest"
"apt:gvfs-backends" = "latest"      # Required for Thunar trash, removable media and remote file systems support
"apt:gvfs-fuse" = "latest"          # Required for Thunar trash, removable media and remote file systems support
"apt:hwinfo" = "latest"
"apt:ipcalc" = "latest"
"apt:libarchive-tools" = "latest"
"apt:libcairo2-dev" = "latest"
"apt:libdbus-1-dev" = "latest"      # Required by the 'dbus-python' package
"apt:libelf-dev" = "latest"         # Linux kernel compilation
"apt:libfontconfig1-dev" = "latest"
"apt:libgirepository-2.0-dev" = "latest"
"apt:libnotify-bin" = "latest"      # For the 'notify-send' command
"apt:libnss3-tools" = "latest"      # Required by the 'mkcert' tool
"apt:libosinfo-bin" = "latest"
"apt:libpcsclite-dev" = "latest"
"apt:libssl-dev" = "latest"         # Linux kernel compilation
"apt:libudev-dev" = "latest"
"apt:libusb-1.0-0-dev" = "latest"
"apt:libxcb-xfixes0-dev" = "latest"
"apt:libxkbcommon-dev" = "latest"
"apt:libyaml-dev" = "latest"
"apt:lshw" = "latest"               # HardWare Lister for Linux
"apt:make" = "latest"
"apt:meson" = "latest"
"apt:nasm" = "latest"               # Required for FFMpeg (installed with asdf)
"apt:network-manager" = "latest"
"apt:openssl" = "latest"
"apt:ovmf" = "latest"
"apt:pgpdump" = "latest"
"apt:pkg-config" = "latest"
"apt:podman" = "latest"
"apt:psmisc" = "latest"             # Required for the 'killall' command for example
"apt:python3-pip" = "latest"
"apt:rsync" = "latest"
"apt:shfmt" = "latest"
"apt:smbclient" = "latest"
"apt:swtpm" = "latest"
"apt:texlive-full" = "latest"          # LaTeX distribution
"apt:tuned" = "latest"
"apt:unzip" = "latest"
"apt:vagrant" = "latest"
"apt:wget" = "latest"
"apt:zip" = "latest"

[settings]
experimental = true

[tools]

